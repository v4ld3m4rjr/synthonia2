[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: ensures client-side routing works in production
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: mirror CSP from public/_headers if netlify.toml is preferred
# Uncomment if you want to manage headers here instead of public/_headers
# [[headers]]
#   for = "/*"
#   [headers.values]
#     Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: wss: https://*.supabase.co; font-src 'self' data:; worker-src 'self' blob:;"